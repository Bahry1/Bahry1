<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ZerinSun</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <div id="stars-container"></div>

  <div id="app">

    <!-- ناحیه امتیاز و لیگ -->
    <div id="score-area">
      <p id="current-score">0 <span class="score-label">SUN</span></p>
      <p id="current-league-label" class="league-label">Bronze League</p>
    </div>

    <!-- سکه زرین سان -->
    <div id="coin-area">
      <img id="sun-coin" src="sun-coin.png" alt="Zerin Sun Coin" />
    </div>

  </div>

  <!-- نوار پایین -->
  <nav id="navbar">
    <button class="nav-button">
      <img src="referral-icon.png" alt="Referral Icon" />
      <span>Referral</span>
    </button>
    <button class="nav-button">
      <img src="channels-icon.png" alt="Channels Icon" />
      <span>Channels</span>
    </button>
    <button class="nav-button">
      <img src="wallet-icon.png" alt="Cups Icon" />
      <span>Cups</span>
    </button>
    <button class="nav-button">
      <img src="daily-icon.png" alt="Daily Icon" />
      <span>Daily</span>
    </button>
  </nav>

  <!-- نوار انرژی پایین -->
  <div id="bottom-energy-bar-container">
    <div id="bottom-energy-bar-fill"></div>
  </div>

  <!-- اسکریپت‌ها -->
  <script src="script.js"></script>
</body>
</html>
