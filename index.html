<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ZerinSun</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <main class="main-container">

    <section class="top-panel">
      <div class="sun-score">
        <span id="sun-count">0.00</span> <span class="unit">SUN</span>
      </div>
      <div class="league-info">
        <span id="league-label">Bronze League</span>
        <button id="league-details-btn" onclick="window.location.href='cups.html'">Details</button>
      </div>
    </section>

    <section class="coin-panel">
      <div class="coin-wrapper">
        <img id="sun-coin" src="sun-icon.png" alt="Sun Coin" />
      </div>
    </section>

    <nav class="bottom-nav">
      <button class="nav-btn" onclick="window.location.href='referral.html'">
        <img src="referral-icon.png" />
        <span>Referral</span>
      </button>
      <button class="nav-btn" onclick="window.location.href='channels.html'">
        <img src="channels-icon.png" />
        <span>Channels</span>
      </button>
      <button class="nav-btn" onclick="window.location.href='wallet.html'">
        <img src="wallet-icon.png" />
        <span>Wallet</span>
      </button>
      <button class="nav-btn" onclick="window.location.href='daily.html'">
        <img src="daily-icon.png" />
        <span>Daily</span>
      </button>
    </nav>

    <div class="energy-bar-container">
      <div id="energy-bar-fill"></div>
    </div>

  </main>

  <script src="script.js"></script>
</body>
</html>
