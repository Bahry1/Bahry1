<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>ZerinSun</title>
  <link rel="stylesheet" href="style.css" />
  <script src="notifier.js"></script>
</head>
<body>
  <canvas id="stars-canvas"></canvas>

  <div class="main-container">
    <div class="sun-score">
      <span id="sun-value">0</span> <span class="unit">SUN</span>
    </div>

    <div class="league-info">
      <span id="league-label">League: 🥉 Bronze</span>
    </div>

    <div class="coin-panel">
      <div class="coin-wrapper">
        <img id="sun-coin" src="coin.png" alt="SUN Coin" />
      </div>
    </div>

    <div class="daily-wrapper">
      <button id="daily-btn" disabled>Loading...</button>
    </div>
  </div>

  <div class="bottom-nav">
    <button class="nav-btn" onclick="location.href='wallet.html'">
      <img src="wallet-icon.png" alt="Wallet" />
      <span>Wallet</span>
    </button>
    <button class="nav-btn" onclick="location.href='channels.html'">
      <img src="channel-icon.png" alt="Channels" />
      <span>Channels</span>
    </button>
    <button class="nav-btn" onclick="location.href='profile.html'">
      <img src="profile-icon.png" alt="Profile" />
      <span>Profile</span>
    </button>
    <button class="nav-btn" onclick="location.href='invite.html'">
      <img src="invite-icon.png" alt="Invite" />
      <span>Invite</span>
    </button>
    <button class="nav-btn" onclick="location.href='settings.html'">
      <img src="settings-icon.png" alt="Settings" />
      <span>Settings</span>
    </button>
  </div>

  <div class="energy-bar-container">
    <div id="energy-bar-fill">
      <span class="energy-label">Energy</span>
    </div>
  </div>

  <div id="notifier"></div>

  <script src="core.js"></script>
  <script src="stars.js"></script>
  <script>
    document.addEventListener("DOMContentLoaded", () => {
      ZerinCore.loadData();
      ZerinCore.checkDailyCycle();

      const sunValue = document.getElementById("sun-value");
      const leagueLabel = document.getElementById("league-label");
      const dailyBtn = document.getElementById("daily-btn");

      const sun = ZerinCore.getSun();
      const league = ZerinCore.getLeague(sun);
      const reward = ZerinCore.getLeagueReward(sun);

      sunValue.textContent = sun.toFixed(2);
      leagueLabel.textContent = `League: ${league}`;

      if (reward === 0) {
        dailyBtn.textContent = "Available in Silver League ↑";
        dailyBtn.disabled = true;
      } else if (ZerinCore.canClaimDaily()) {
        dailyBtn.textContent = `Claim +${reward} SUN`;
        dailyBtn.disabled = false;
      } else {
        dailyBtn.textContent = "Come back tomorrow 🌙";
        dailyBtn.disabled = true;
      }

      dailyBtn.addEventListener("click", () => {
        const gained = ZerinCore.claimDailyReward();
        if (gained > 0) {
          dailyBtn.textContent = `✅ Claimed ${gained} SUN`;
          dailyBtn.disabled = true;
          sunValue.textContent = ZerinCore.getSun().toFixed(2);
          notify(`+${gained} SUN received! ☀️`, "success");
        }
      });

      const coin = document.getElementById("sun-coin");
      if (coin) {
        coin.addEventListener("click", () => {
          const tapValue = 0.01;
          if (ZerinCore.useEnergy(tapValue)) {
            ZerinCore.addSun(tapValue);
            ZerinCore.addTap();
            coin.style.transform = "scale(0.94)";
            setTimeout(() => (coin.style.transform = "scale(1)"), 120);
            sunValue.textContent = ZerinCore.getSun().toFixed(2);
          } else {
            notify("⚡ Not enough energy!", "warning");
          }
        });
      }
    });
  </script>
</body>
</html>
