<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>ZerinSun</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div id="stars-container"></div>

  <div id="app">
    <div id="score-area">
      <p id="current-score">0</p>
      <span class="score-label">SUN</span>
      <div id="cup-info">
        <span id="current-cup">Bronze League</span>
        <button id="cup-details-button">Details</button>
      </div>
    </div>

    <div id="coin-area">
      <img id="sun-coin" src="sun-icon.png" alt="Zerin Sun Coin">
    </div>

    <div id="energy-bar-container">
      <div id="energy-bar-fill"></div>
    </div>
  </div>

  <div id="daily-popup" class="fullscreen-popup hidden">
    <h3>Daily Energy Info</h3>
    <div id="daily-timer"></div>
    <p>Energy: <span id="energy-value">50</span> / 50</p>
    <div id="daily-energy-bar-container">
      <div id="daily-energy-bar-fill"></div>
    </div>
    <p>Total Suns Collected: <span id="total-score">0</span></p>
    <button id="close-daily">Close</button>
  </div>

  <div id="cup-popup" class="fullscreen-popup hidden">
    <h3>Cup System</h3>
    <div id="cup-slider"></div>
    <button id="close-cup">Close</button>
  </div>

  <nav id="navbar">
    <button class="nav-button">
      <img src="referral-icon.png" alt="Referral Icon">
      <span>Referral</span>
    </button>
    <button class="nav-button">
      <img src="channels-icon.png" alt="Channels Icon">
      <span>Channels</span>
    </button>
    <button class="nav-button">
      <img src="wallet-icon.png" alt="Wallet Icon">
      <span>Wallet</span>
    </button>
    <button class="nav-button" id="daily-button">
      <img src="daily-icon.png" alt="Daily Icon">
      <span>Daily</span>
    </button>
  </nav>

  <script src="script.js"></script>
  <script src="stars.js"></script>
</body>
</html>
