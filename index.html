<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ZerinSun</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <!-- ستاره‌ها یا پس‌زمینه دلخواه -->
  <div id="stars-container"></div>

  <!-- اسکلت اصلی اپ -->
  <div id="app">

    <!-- 🏅 لیگ فعلی + لینک رفتن به صفحه کاپ -->
    <p id="current-league-label" class="league-label">Bronze League</p>

    <!-- 🪙 سکه زرین سان -->
    <div id="coin-area">
      <img id="sun-coin" src="sun-coin.png" alt="Zerin Sun Coin" />
    </div>

    <!-- 🔢 امتیاز -->
    <div id="score-area">
      <p id="current-score">0 <span class="score-label">SUN</span></p>
    </div>

  </div>

  <!-- 📱 نوار پایین -->
  <nav id="navbar">
    <button class="nav-button" onclick="window.location.href='referral.html'">
      <img src="referral-icon.png" alt="Referral Icon" />
      <span>Referral</span>
    </button>
    <button class="nav-button" onclick="window.location.href='channels.html'">
      <img src="channels-icon.png" alt="Channels Icon" />
      <span>Channels</span>
    </button>
    <button class="nav-button" onclick="window.location.href='wallet.html'">
      <img src="wallet-icon.png" alt="Wallet Icon" />
      <span>Wallet</span>
    </button>
    <button class="nav-button" onclick="window.location.href='daily.html'">
      <img src="daily-icon.png" alt="Daily Icon" />
      <span>Daily</span>
    </button>
  </nav>

  <!-- ⚡ نوار انرژی پایین -->
  <div id="bottom-energy-bar-container">
    <div id="bottom-energy-bar-fill"></div>
  </div>

  <!-- اسکریپت -->
  <script src="script.js"></script>
</body>
</html>
