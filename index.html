<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>ZerinSun - Home</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <style>
    body {
      margin: 0;
      font-family: "Segoe UI", sans-serif;
      background-color: #000;
      color: #fff;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .top-section {
      text-align: center;
      margin-top: 18px;
    }

    .tap-count {
      font-size: 2rem;
      color: #ffaa00;
    }

    .cup-level {
      font-size: 1rem;
      color: #88ccff;
      margin-top: 6px;
      cursor: pointer;
      text-decoration: underline;
    }

    .coin-image {
      width: 120px;
      height: 120px;
      border-radius: 50%;
      background: radial-gradient(#ffe066, #cc9900);
      margin: 24px 0;
      box-shadow: 0 0 16px #ff0;
    }

    .icon-bar {
      display: flex;
      justify-content: space-around;
      width: 100%;
      max-width: 400px;
      margin-bottom: 12px;
    }

    .icon-button {
      flex: 1;
      text-align: center;
      color: #ffcc66;
      font-size: 0.85rem;
      padding: 8px;
      text-decoration: none;
    }

    .icon-button:hover {
      background-color: #111;
    }

    .energy-bar-container {
      width: 90%;
      max-width: 400px;
      background: #222;
      border-radius: 10px;
      height: 16px;
      overflow: hidden;
      margin-bottom: 20px;
      box-shadow: inset 0 0 6px #000;
    }

    .energy-bar-fill {
      height: 100%;
      background: linear-gradient(to right, #ffaa00, #ff5500);
      width: 0%;
      transition: width 0.3s ease;
    }

    .energy-text {
      text-align: center;
      font-size: 0.85rem;
      color: #88ffcc;
      margin-bottom: 10px;
    }
  </style>
</head>
<body>
  <div class="top-section">
    <div class="tap-count">Taps Today: <span id="tap-count">0</span></div>
    <div class="cup-level" onclick="location.href='cups.html'">
      <span id="cup-level">League</span>
    </div>
  </div>

  <div class="coin-image"></div>

  <div class="icon-bar">
    <a href="daily.html" class="icon-button">🌞 Daily</a>
    <a href="#" class="icon-button">💰 Wallet</a>
    <a href="#" class="icon-button">📢 Channels</a>
    <a href="#" class="icon-button">🎁 Referral</a>
  </div>

  <div class="energy-text" id="energy-display">Loading...</div>
  <div class="energy-bar-container">
    <div class="energy-bar-fill" id="energy-fill"></div>
  </div>

  <script src="core.js"></script>
  <script>
    let tapCount = parseInt(localStorage.getItem("tapCount") || "0");

    function updateAll() {
      document.getElementById("tap-count").textContent = tapCount;
      document.getElementById("cup-level").textContent = ZerinCore.getCupLevel();

      const energy = ZerinCore.getEnergy();
      const percent = (energy / ZerinCore.MAX_ENERGY) * 100;
      document.getElementById("energy-fill").style.width = percent + "%";
      document.getElementById("energy-display").textContent = energy.toFixed(3) + " / " + ZerinCore.MAX_ENERGY;
    }

    document.addEventListener("DOMContentLoaded", updateAll);
  </script>
</body>
</html>
