<!DOCTYPE html>
<html lang="fa">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>زرین سان - مینی‌اپ</title>
    <link rel="stylesheet" href="style.css">
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
</head>
<body>
    <div class="container">
        <h1>به مینی‌اپ زرین سان خوش آمدید!</h1>
        <p class="welcome-text">این مینی‌اپ طلایی، آینده شماست. برای کسب جوایز SUN تپ کنید!</p>

        <div class="score-display">
            امتیاز شما: <span id="currentScore">0</span> SUN
        </div>

        <button id="tapButton" class="tap-button">
            <img src="sun-icon.png" alt="خورشید" class="sun-icon">
            تپ کنید!
        </button>

        <p class="footer-text">قدرت گرفته از The Open Network</p>
    </div>

    <script src="script.js"></script>
</body>
</html>
