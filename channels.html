<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Channels - ZerinSun</title>
  <style>
    body {
      background: #111;
      color: #eee;
      font-family: "Segoe UI", sans-serif;
      margin: 0;
      padding: 0;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      align-items: center;
    }

    .heading {
      margin-top: 40px;
      text-align: center;
    }

    .heading h1 {
      color: #00e6ff;
      margin-bottom: 0.5rem;
    }

    .heading p {
      color: #ccc;
      font-size: 1rem;
      margin: 0;
    }

    .channel-box {
      margin: 40px auto;
      width: 90%;
      max-width: 500px;
      background: #222;
      border: 2px solid #ffaa00aa;
      border-radius: 16px;
      padding: 1.5rem;
      box-shadow: 0 0 12px #000a;
    }

    .channel-box p {
      color: #aaa;
      margin: 0.5rem 0;
    }

    .back-btn {
      margin: 32px 0;
      padding: 10px 24px;
      background: rgba(255,255,255,0.05);
      color: #ffd700;
      font-weight: bold;
      text-decoration: none;
      border-radius: 10px;
      border: 1px solid #ffaa00aa;
      box-shadow: 0 0 6px #ffcc00aa;
      transition: background 0.2s ease;
    }

    .back-btn:hover {
      background: rgba(255,255,255,0.12);
    }
  </style>
</head>
<body>
  <div class="heading">
    <h1>📡 ZerinSun Channels</h1>
    <p>Welcome to our channels — pick your favorite topics and explore!</p>
  </div>

  <div class="channel-box">
    <!-- کانال‌ها اینجا اضافه می‌شن -->
    <p>🔗 Tech Channel</p>
    <p>📈 Crypto News</p>
    <p>🎮 Gaming Zone</p>
    <!-- می‌تونی بعداً با JS این بخشو دینامیک کنی -->
  </div>

  <a href="index.html" class="back-btn">← Back to Home</a>
</body>
</html>
