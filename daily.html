<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Daily Reward - ZerinSun</title>
  <style>
    body {
      background: radial-gradient(circle at bottom, #121212, #000000);
      color: white;
      font-family: "Segoe UI", sans-serif;
      text-align: center;
      padding: 60px 20px;
      margin: 0;
    }
    h1 {
      font-size: 1.8em;
      color: #ffcc00;
      text-shadow: 0 0 6px #ffdd55;
      margin-bottom: 20px;
    }
    #timer {
      font-size: 2em;
      font-weight: bold;
      margin: 20px 0;
      color: #00e6ff;
      text-shadow: 0 0 6px #00ffffaa;
    }
    button {
      padding: 12px 26px;
      font-size: 1em;
      border: none;
      border-radius: 8px;
      background: linear-gradient(90deg, #ffd700, #ffa500);
      color: #000;
      font-weight: bold;
      box-shadow: 0 0 10px #ffd70055;
      cursor: pointer;
    }
    button:disabled {
      opacity: 0.4;
      cursor: default;
    }

    /* --- Energy Bar --- */
    .energy-bar-container {
      width: 90%;
      max-width: 360px;
      height: 26px;
      margin: 40px auto 12px;
      background: #222;
      position: relative;
      border-radius: 10px;
      overflow: hidden;
      box-shadow: 0 0 5px #00e6ff33;
    }

    #energy-bar-fill {
      width: 100%;
      height: 100%;
      background: linear-gradient(90deg, #00ffcc, #00e6ff);
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
    }

    .energy-label {
      color: #000;
      font-size: 0.8em;
      font-weight: bold;
      text-shadow: 0 0 2px #ffffffaa;
      pointer-events: none;
    }

    .back-btn {
      display: block;
      margin: 6px auto 32px;
      padding: 8px 20px;
      background: rgba(255,255,255,0.05);
      color: #ffd700;
      font-weight: bold;
      text-decoration: none;
      border-radius: 10px;
      border: 1px solid #ffaa00aa;
      box-shadow: 0 0 6px #ffcc00aa;
      transition: background 0.2s ease;
    }

    .back-btn:hover {
      background: rgba(255,255,255,0.12);
    }
  </style>
</head>
<body>

  <h1>🎁 Daily Reward</h1>
  <div id="timer">00:00:00</div>
  <button id="collect-btn">Collect SUN</button>

  <div class="energy-bar-container">
    <div id="energy-bar-fill">
      <span class="energy-label">50 / 50 Energy</span>
    </div>
  </div>

  <a href="index.html" class="back-btn">← Back to Home</a>

  <script>
    const timerEl = document.getElementById("timer");
    const btn = document.getElementById("collect-btn");

    function getResetTime() {
      const now = new Date();
      const next = new Date();
      next.setHours(24, 0, 0, 0);
      return next - now;
    }

    function format(ms) {
      const totalSec = Math.floor(ms / 1000);
      const h = String(Math.floor(totalSec / 3600)).padStart(2, "0");
      const m = String(Math.floor((totalSec % 3600) / 60)).padStart(2, "0");
      const s = String(totalSec % 60).padStart(2, "0");
      return `${h}:${m}:${s}`;
    }

    function startTimer() {
      let timeLeft = getResetTime();
      timerEl.textContent = format(timeLeft);

      const interval = setInterval(() => {
        timeLeft -= 1000;
        if (timeLeft <= 0) {
          clearInterval(interval);
          btn.disabled = false;
          btn.textContent = "Collect SUN";
          timerEl.textContent = "00:00:00";
        } else {
          timerEl.textContent = format(timeLeft);
        }
      }, 1000);
    }

    btn.addEventListener("click", () => {
      btn.disabled = true;
      btn.textContent = "Collected ✅";
      startTimer();
    });

    // Optional: disable button until first claim
    // btn.disabled = true;
    startTimer();
  </script>
</body>
</html>
