<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Daily Reward - ZerinSun</title>
  <style>
    body {
      background: radial-gradient(circle at bottom, #121212, #000000);
      color: white;
      font-family: "Segoe UI", sans-serif;
      text-align: center;
      padding: 60px 20px;
    }
    h1 {
      font-size: 1.8em;
      color: #ffcc00;
      text-shadow: 0 0 6px #ffdd55;
      margin-bottom: 20px;
    }
    #timer {
      font-size: 2em;
      font-weight: bold;
      margin: 20px 0;
      color: #00e6ff;
      text-shadow: 0 0 6px #00ffffaa;
    }
    button {
      padding: 12px 26px;
      font-size: 1em;
      border: none;
      border-radius: 8px;
      background: linear-gradient(90deg, #ffd700, #ffa500);
      color: #000;
      font-weight: bold;
      box-shadow: 0 0 10px #ffd70055;
      cursor: pointer;
    }
    button:disabled {
      opacity: 0.4;
      cursor: default;
    }
  </style>
</head>
<body>
  <h1>🎁 Daily Reward</h1>
  <div id="timer">00:00:00</div>
  <button id="collect-btn">Collect SUN</button>

  <script>
    const timerEl = document.getElementById("timer");
    const btn = document.getElementById("collect-btn");

    function getResetTime() {
      const now = new Date();
      const next = new Date();
      next.setHours(24, 0, 0, 0); // midnight
      return next - now;
    }

    function format(ms) {
      const totalSec = Math.floor(ms / 1000);
      const h = String(Math.floor(totalSec / 3600)).padStart(2, "0");
      const m = String(Math.floor((totalSec % 3600) / 60)).padStart(2, "0");
      const s = String(totalSec % 60).padStart(2, "0");
      return `${h}:${m}:${s}`;
    }

    function startTimer() {
      let timeLeft = getResetTime();
      timerEl.textContent = format(timeLeft);

      const interval = setInterval(() => {
        timeLeft -= 1000;
        if (timeLeft <= 0) {
          clearInterval(interval);
          btn.disabled = false;
          btn.textContent = "Collect SUN";
          timerEl.textContent = "00:00:00";
        } else {
          timerEl.textContent = format(timeLeft);
        }
      }, 1000);
    }

    btn.addEventListener("click", () => {
      btn.disabled = true;
      btn.textContent = "Collected ✅";
      startTimer();
    });

    // Optional: prevent early collect
    btn.disabled = false; // set to true if needed
  </script>
</body>
</html>
