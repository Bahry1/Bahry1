<!DOCTYPE html>
<html lang="fa">
<head>
  <meta charset="UTF-8" />
  <title>انرژی روزانه - ZerinSun</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="stylesheet" href="style.css" />
  <style>
    .energy-bar-wrapper {
      height: 10px;
      background: #222;
      border-radius: 6px;
      overflow: hidden;
      margin: 16px auto;
      width: 90%;
    }

    .energy-bar-fill {
      height: 100%;
      width: 0%;
      transition: width 0.3s ease, background 0.3s ease;
    }

    .energy-bar-fill.normal {
      background: linear-gradient(90deg, #00ffcc, #00e6ff);
    }

    .energy-bar-fill.low {
      background: linear-gradient(90deg, #ffc0a8, #ff8a65);
    }

    .energy-text {
      text-align: center;
      margin-bottom: 16px;
      color: #ffd;
      font-family: "Segoe UI", sans-serif;
      font-size: 0.9em;
    }

    .timer {
      text-align: center;
      margin-top: 24px;
      color: #ffe14a;
      font-size: 1.2em;
      font-family: "Segoe UI", sans-serif;
    }

    .clock-text {
      margin-top: 4px;
      font-size: 1.1em;
    }

    .spacer {
      height: 100px;
    }

    .footer {
      text-align: center;
      margin-bottom: 40px;
    }

    .back-btn {
      text-decoration: none;
      color: #ccc;
      font-size: 0.9em;
      padding: 8px 14px;
      border-radius: 6px;
      border: 1px solid #555;
    }

    .back-btn:hover {
      background: #111;
      color: #fff;
    }
  </style>
</head>
<body>
  <div class="timer" id="daily-timer">
    <div id="daily-date">📅 امروز</div>
    <div class="clock-text" id="clock-time">🕒 حالا</div>
  </div>

  <div class="spacer"></div>

  <div class="energy-section">
    <div class="energy-bar-wrapper">
      <div class="energy-bar-fill" id="energy-fill"></div>
    </div>
    <div class="energy-text" id="energy-remaining">باقی‌مانده خط انرژی: ...</div>
  </div>

  <div class="footer">
    <a href="index.html" class="back-btn">← بازگشت به خانه</a>
  </div>

  <script src="core.js"></script>
  <script>
    function updateEnergyDisplay() {
      const energy = ZerinCore.getEnergy();
      const max = ZerinCore.MAX_ENERGY;
      const percent = (energy / max) * 100;

      const bar = document.getElementById("energy-fill");
      const label = document.getElementById("energy-remaining");

      if (bar) {
        bar.style.width = percent + "%";
        bar.classList.remove("normal", "low");
        bar.classList.add(percent <= 10 ? "low" : "normal");
      }

      if (label) {
        label.textContent = `باقی‌مانده خط انرژی: ${energy.toFixed(2)}`;
      }
    }

    function updateClock() {
      const now = new Date();
      const h = now.getHours().toString().padStart(2, "0");
      const m = now.getMinutes().toString().padStart(2, "0");
      const s = now.getSeconds().toString().padStart(2, "0");
      document.getElementById("clock-time").textContent = `🕒 حالا: ${h}:${m}:${s}`;
    }

    function updateDate() {
      const now = new Date();
      const dateString = now.toLocaleDateString("fa-IR", {
        year: "numeric",
        month: "2-digit",
        day: "2-digit"
      });
      document.getElementById("daily-date").textContent = `📅 امروز: ${dateString}`;
    }

    function fullUpdate() {
      ZerinCore.loadData();
      updateDate();
      updateClock();
      updateEnergyDisplay();
    }

    document.addEventListener("DOMContentLoaded", () => {
      fullUpdate();
      setInterval(updateClock, 1000);
    });

    window.addEventListener("pageshow", fullUpdate);
    window.addEventListener("focus", fullUpdate);
  </script>
</body>
</html>
