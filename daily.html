<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Daily Energy - ZerinSun</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <style>
    body {
      margin: 0;
      background-color: #000;
      color: #fff;
      font-family: "Segoe UI", sans-serif;
      display: flex;
      flex-direction: column;
      min-height: 100vh;
    }

    .timer {
      text-align: center;
      font-size: 1rem;
      padding: 12px;
      color: #ffe066;
      background: #111;
      border-bottom: 1px solid #333;
      box-shadow: 0 1px 4px #000;
    }

    .spacer {
      flex-grow: 1;
    }

    .energy-section {
      text-align: center;
      padding: 24px 16px 12px;
      background: linear-gradient(to top, #111, #000);
      border-top: 1px solid #333;
    }

    .energy-bar-wrapper {
      background-color: #222;
      border-radius: 20px;
      overflow: hidden;
      height: 18px;
      margin-bottom: 10px;
      width: 90%;
      max-width: 400px;
      margin-left: auto;
      margin-right: auto;
      box-shadow: inset 0 0 6px #000;
    }

    .energy-bar-fill {
      height: 100%;
      background: linear-gradient(90deg, #ffda44, #ffaa00);
      width: 0%;
      transition: width 0.3s ease;
    }

    .energy-text {
      font-size: 0.9em;
      color: #88ffcc;
    }

    .footer {
      text-align: center;
      padding-bottom: 20px;
    }

    .back-btn {
      display: inline-block;
      margin-top: 16px;
      padding: 8px 24px;
      background-color: rgba(255, 255, 255, 0.07);
      color: #ffd700;
      border: 1px solid #ffaa00aa;
      border-radius: 10px;
      font-weight: bold;
      text-decoration: none;
      box-shadow: 0 0 6px #ffaa00aa;
      transition: background 0.2s;
    }

    .back-btn:hover {
      background-color: rgba(255, 255, 255, 0.15);
    }
  </style>
</head>
<body>
  <div class="timer" id="daily-timer"></div>

  <div class="spacer"></div> <!-- فضای خالی وسط برای آینده -->

  <div class="energy-section">
    <div class="energy-bar-wrapper">
      <div class="energy-bar-fill" id="energy-fill"></div>
    </div>
    <div class="energy-text" id="energy-display">Loading...</div>
  </div>

  <div class="footer">
    <a href="index.html" class="back-btn">← Back to Home</a>
  </div>

  <script src="core.js"></script>
  <script>
    document.addEventListener("DOMContentLoaded", () => {
      const fill = document.getElementById("energy-fill");
      const display = document.getElementById("energy-display");
      const timer = document.getElementById("daily-timer");

      // انرژی
      const energy = ZerinCore.getEnergy();
      const percent = (energy / ZerinCore.MAX_ENERGY) * 100;

      fill.style.width = percent + "%";
      display.textContent = ZerinCore.getEnergyDisplay();

      // تاریخ امروز
      const now = new Date();
      const dateString = now.toLocaleDateString("en-CA", {
        year: "numeric",
        month: "2-digit",
        day: "2-digit"
      });
      timer.textContent = `📅 Today: ${dateString}`;
    });
  </script>
</body>
</html>
