<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Invite Friends - ZerinSun</title>
  <link rel="stylesheet" href="style.css" />
  <style>
    body {
      background: #000;
      color: #fff;
      font-family: "Vazirmatn", sans-serif;
      margin: 0;
      padding: 0;
      display: flex;
      flex-direction: column;
      min-height: 100vh;
    }

    .heading {
      text-align: center;
      padding: 2rem 1rem 1rem;
    }

    .heading h1 {
      color: #00e6ff;
      margin-bottom: 0.5rem;
    }

    .heading p {
      color: #ccc;
      margin: 0;
      font-size: 1rem;
    }

    .invite-box {
      flex-grow: 1;
      margin: 1rem auto;
      width: 90%;
      max-width: 500px;
      background: #111;
      border: 2px solid #ffaa00aa;
      border-radius: 16px;
      padding: 1.5rem;
      box-shadow: 0 0 12px #000a;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .section-title {
      font-size: 1.4em;
      margin-bottom: 1rem;
      color: #ffe14a;
    }

    .reward-text {
      font-size: 1.1em;
      margin: 0.3rem 0;
      color: #ffd700;
    }

    #ref-link {
      width: 100%;
      padding: 10px;
      margin-top: 1rem;
      border-radius: 8px;
      border: none;
      text-align: center;
      background: #222;
      color: #fff;
    }

    #copy-btn {
      margin-top: 10px;
      padding: 8px 20px;
      border: none;
      background: #444;
      color: #fff;
      border-radius: 8px;
      cursor: pointer;
      transition: 0.3s ease;
    }

    #copy-btn:hover {
      background: #666;
    }

    .invite-box select {
      margin-top: 14px;
      padding: 10px;
      background: #222;
      border: 1px solid #555;
      color: #aaa;
      border-radius: 6px;
      width: 100%;
    }

    .back-wrapper {
      background: #222;
      border: 2px solid #ffaa00aa;
      border-radius: 16px;
      padding: 1rem 2rem;
      margin: 2rem auto;
      box-shadow: 0 0 12px #000a;
      display: flex;
      justify-content: center;
      width: fit-content;
      max-width: 90%;
    }

    .back-btn {
      padding: 12px 28px;
      background: rgba(255,255,255,0.05);
      color: #ffd700;
      font-weight: bold;
      text-decoration: none;
      border-radius: 10px;
      border: 1px solid #ffaa00aa;
      font-size: 1.1rem;
      transition: background 0.2s ease;
    }

    .back-btn:hover {
      background: rgba(255,255,255,0.12);
    }
  </style>
</head>
<body>

  <div class="heading">
    <h1>🎁 Invite Friends</h1>
    <p>Share your link and earn SUN from your friends!</p>
  </div>

  <div class="invite-box">
    <div class="section-title">Referral Summary</div>

    <div class="reward-text" id="reward">Your Reward: 0 SUN</div>
    <div class="reward-text" id="invite-count">Invited: 0</div>

    <select disabled>
      <option>Invited Friends (not visible)</option>
    </select>

    <input id="ref-link" readonly />
    <button id="copy-btn">📋 Copy Link</button>
  </div>

  <div class="back-wrapper">
    <a href="index.html" class="back-btn">← Back to Home</a>
  </div>

  <script src="core.js"></script>
  <script>
    function getReferralReward(count) {
      if (count >= 1 && count <= 5) return 5;
      if (count >= 6 && count <= 10) return 10;
      if (count >= 11 && count <= 15) return 15;
      if (count >= 16 && count <= 20) return 20;
      if (count >= 21 && count <= 30) return 30;
      return 0;
    }

    document.addEventListener("DOMContentLoaded", () => {
      const user = ZerinCore.getUserId();
      const inviteCount = ZerinCore.getInviteCount();

      const reward = getReferralReward(inviteCount);
      document.getElementById("invite-count").textContent = `Invited: ${inviteCount}`;
      document.getElementById("reward").textContent = `Your Reward: ${reward} SUN`;

      const refLink = `${window.location.origin}/index.html?ref=${user}`;
      document.getElementById("ref-link").value = refLink;

      const copyBtn = document.getElementById("copy-btn");
      copyBtn.addEventListener("click", () => {
        navigator.clipboard.writeText(refLink);
        copyBtn.textContent = "✅ Copied!";
        setTimeout(() => {
          copyBtn.textContent = "📋 Copy Link";
        }, 1500);
      });
    });
  </script>

</body>
</html>
