<!DOCTYPE html>
<html lang="fa">
<head>
  <meta charset="UTF-8">
  <title>دعوت دوستان - ZerinSun</title>
  <link rel="stylesheet" href="style.css" />
  <style>
    body {
      background: #000;
      color: #fff;
      font-family: "Vazirmatn", sans-serif;
      padding: 20px;
      text-align: center;
    }

    .invite-box {
      background: #111;
      border: 1px solid #333;
      padding: 20px;
      border-radius: 10px;
      margin-bottom: 20px;
    }

    .invite-count {
      font-size: 1.2em;
      margin-bottom: 10px;
    }

    .reward-box {
      background: #222;
      padding: 14px;
      border-radius: 8px;
      margin-top: 10px;
      color: #ffe14a;
      font-weight: bold;
    }
  </style>
</head>
<body>

  <h2>🎁 دعوت دوستان</h2>

  <div class="invite-box">
    <div class="invite-count" id="invite-count">شما تاکنون <span>0</span> نفر را دعوت کرده‌اید.</div>
    <div class="reward-box" id="reward-display">پاداش شما: 0 SUN</div>
    <div class="reward-box" id="next-goal">🎯 برای دریافت پاداش بعدی، <span>1</span> دعوت دیگر نیاز دارید.</div>
  </div>

  <script src="core.js"></script>
  <script>
    const inviteCount = 12; // 👈 اینو بعداً از دیتای واقعی بگیر

    function getReferralReward(count) {
      if (count >= 1 && count <= 5) return 5;
      if (count >= 6 && count <= 10) return 10;
      if (count >= 11 && count <= 15) return 15;
      if (count >= 16 && count <= 20) return 20;
      if (count >= 21 && count <= 30) return 30;
      return 0;
    }

    function getNextThreshold(count) {
      if (count < 5) return 5;
      if (count < 10) return 10;
      if (count < 15) return 15;
      if (count < 20) return 20;
      if (count < 30) return 30;
      return null;
    }

    document.addEventListener("DOMContentLoaded", () => {
      document.getElementById("invite-count").innerHTML =
        `شما تاکنون <span>${inviteCount}</span> نفر را دعوت کرده‌اید.`;

      const reward = getReferralReward(inviteCount);
      document.getElementById("reward-display").textContent = `پاداش شما: ${reward} SUN`;

      const next = getNextThreshold(inviteCount);
      document.getElementById("next-goal").textContent = next
        ? `🎯 برای دریافت پاداش بعدی، ${next - inviteCount} دعوت دیگر نیاز دارید.`
        : `✅ شما به بالاترین پاداش رسیدید!`;
    });
  </script>

</body>
</html>
