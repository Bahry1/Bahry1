<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Cups - ZerinSun</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <canvas id="stars-canvas"></canvas>

  <div class="main-container">
    <div class="heading">
      <h1>🏆 Your Cups</h1>
    </div>

    <div class="cup-row">
      <div class="cup-item" data-cup="🥉 Bronze">
        <img src="images/cups/bronze-cup.png" alt="Bronze" />
        <div class="cup-label">🥉 Bronze</div>
      </div>
      <div class="cup-item" data-cup="🥈 Silver">
        <img src="images/cups/silver-cup.png" alt="Silver" />
        <div class="cup-label">🥈 Silver</div>
      </div>
      <div class="cup-item" data-cup="🏆 Gold">
        <img src="images/cups/gold-cup.png" alt="Gold" />
        <div class="cup-label">🏆 Gold</div>
      </div>
      <div class="cup-item" data-cup="💚 Emerald">
        <img src="images/cups/emerald-cup.png" alt="Emerald" />
        <div class="cup-label">💚 Emerald</div>
      </div>
      <div class="cup-item" data-cup="💙 Sapphire">
        <img src="images/cups/sapphire-cup.png" alt="Sapphire" />
        <div class="cup-label">💙 Sapphire</div>
      </div>
      <div class="cup-item" data-cup="❤️ Ruby">
        <img src="images/cups/ruby-cup.png" alt="Ruby" />
        <div class="cup-label">❤️ Ruby</div>
      </div>
      <div class="cup-item" data-cup="💎 Diamond">
        <img src="images/cups/diamond-cup.png" alt="Diamond" />
        <div class="cup-label">💎 Diamond</div>
      </div>
      <div class="cup-item" data-cup="🌟 Legendary">
        <img src="images/cups/legendary-cup.png" alt="Legendary" />
        <div class="cup-label">🌟 Legendary</div>
      </div>
    </div>

    <div class="back-wrapper">
      <a href="index.html" class="back-btn">← Back to Home</a>
    </div>
  </div>

  <script src="core.js"></script>
  <script src="stars.js"></script>
  <script>
    document.addEventListener("DOMContentLoaded", () => {
      ZerinCore.loadData();
      const cup = ZerinCore.getCupLevel();
      const items = document.querySelectorAll(".cup-item");

      items.forEach(el => {
        if (el.dataset.cup === cup) {
          el.classList.add("active");
        }
      });
    });
  </script>
</body>
</html>
