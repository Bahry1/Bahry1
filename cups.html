<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Leagues - ZerinSun</title>
  <style>
    body {
      background: #111;
      font-family: "Segoe UI", sans-serif;
      color: white;
      text-align: center;
      padding: 30px 10px;
    }
    h1 {
      color: #ffd700;
      margin-bottom: 20px;
      text-shadow: 0 0 4px #ffda50;
    }
    .cups {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(120px, 1fr));
      gap: 20px;
      margin-top: 20px;
    }
    .cup {
      background: #1c1c1c;
      border-radius: 12px;
      padding: 16px;
      box-shadow: 0 0 6px #00000088;
    }
    .cup img {
      width: 64px;
      height: 64px;
      object-fit: contain;
      margin-bottom: 8px;
    }
    .cup-name {
      font-size: 0.9em;
      color: #ddd;
    }
  </style>
</head>
<body>
  <h1>🏆 League Cups</h1>
  <div class="cups">
    <div class="cup"><img src="images/cups/bronze.png" /><div class="cup-name">Bronze</div></div>
    <div class="cup"><img src="images/cups/silver.png" /><div class="cup-name">Silver</div></div>
    <div class="cup"><img src="images/cups/gold.png" /><div class="cup-name">Gold</div></div>
    <div class="cup"><img src="images/cups/emerald.png" /><div class="cup-name">Emerald</div></div>
    <div class="cup"><img src="images/cups/sapphire.png" /><div class="cup-name">Sapphire</div></div>
    <div class="cup"><img src="images/cups/ruby.png" /><div class="cup-name">Ruby</div></div>
    <div class="cup"><img src="images/cups/diamond.png" /><div class="cup-name">Diamond</div></div>
    <div class="cup"><img src="images/cups/legendary.png" /><div class="cup-name">Legendary</div></div>
  </div>
</body>
</html>
