<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Wallet - ZerinSun</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <canvas id="stars-canvas"></canvas>

  <div class="main-container">
    <div class="sun-score">
      <span id="wallet-sun">0</span> <span class="unit">SUN</span>
    </div>

    <div class="league-info">
      <span id="wallet-league">League: 🥉 Bronze</span>
    </div>

    <div class="coin-panel">
      <div class="coin-wrapper">
        <img src="coin.png" alt="SUN Coin" style="width: 120px; height: 120px;" />
      </div>
    </div>

    <div class="spacer"></div>

    <div class="back-wrapper">
      <a href="index.html" class="back-btn">← Back to Home</a>
    </div>
  </div>

  <script src="core.js"></script>
  <script src="stars.js"></script>
  <script>
    document.addEventListener("DOMContentLoaded", () => {
      ZerinCore.loadData();
      const sun = ZerinCore.getSun();
      const league = ZerinCore.getLeague();

      document.getElementById("wallet-sun").textContent = sun.toFixed(2);
      document.getElementById("wallet-league").textContent = `League: ${league}`;
    });
  </script>
</body>
</html>
