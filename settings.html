<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Settings - ZerinSun</title>
  <link rel="stylesheet" href="style.css" />
  <script src="notifier.js"></script>
  <style>
    body {
      background: #000;
      color: #fff;
      font-family: "Vazirmatn", sans-serif;
      margin: 0;
      padding: 0;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .heading {
      text-align: center;
      padding: 2rem 1rem 1rem;
    }

    .heading h1 {
      color: #00e6ff;
      margin-bottom: 0.5rem;
    }

    .settings-box {
      width: 90%;
      max-width: 450px;
      background: #111;
      border: 2px solid #ffaa00aa;
      border-radius: 16px;
      padding: 1.5rem;
      margin-bottom: 2rem;
      box-shadow: 0 0 12px #000a;
    }

    .settings-item {
      margin: 1rem 0;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .settings-btn {
      padding: 12px 20px;
      font-size: 1rem;
      font-weight: bold;
      background: #222;
      color: #ffd700;
      border-radius: 10px;
      border: 1px solid #ffaa00aa;
      cursor: pointer;
      transition: background 0.2s ease;
    }

    .settings-btn:hover {
      background: #333;
    }

    .back-wrapper {
      background: #222;
      border: 2px solid #ffaa00aa;
      border-radius: 16px;
      padding: 1rem 2rem;
      box-shadow: 0 0 12px #000a;
      display: flex;
      justify-content: center;
      width: fit-content;
      max-width: 90%;
    }

    .back-btn {
      padding: 12px 28px;
      background: rgba(255,255,255,0.05);
      color: #ffd700;
      font-weight: bold;
      text-decoration: none;
      border-radius: 10px;
      border: 1px solid #ffaa00aa;
      font-size: 1.1rem;
      transition: background 0.2s ease;
    }

    .back-btn:hover {
      background: rgba(255,255,255,0.12);
    }
  </style>
</head>
<body>

  <div class="heading">
    <h1>⚙️ Settings</h1>
  </div>

  <div class="settings-box">
    <div class="settings-item">
      <button class="settings-btn" onclick="clearData()">❌ Clear All Local Data</button>
      <button class="settings-btn" onclick="resetSplash()">↩️ Reset Welcome Screen</button>
    </div>
  </div>

  <div class="back-wrapper">
    <a href="index.html" class="back-btn">← Back to Home</a>
  </div>

  <div id="notifier"></div>

  <script>
    function clearData() {
      localStorage.clear();
      notify("🧹 All local data cleared!", "warning");
    }

    function resetSplash() {
      localStorage.removeItem("splashSeen");
      notify("🔄 Splash screen will appear next time", "info");
    }
  </script>

</body>
</html>
