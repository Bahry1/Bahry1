<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Profile - ZerinSun</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <canvas id="stars-canvas"></canvas>

  <div class="main-container">
    <div class="heading">
      <h1>👤 My Profile</h1>
    </div>

    <div class="profile-box">
      <div class="profile-item">User ID: <span id="user-id">Loading...</span></div>
      <div class="profile-item">League: <span id="user-league">Loading...</span></div>
      <div class="profile-item">Total SUN: <span id="user-sun">0</span></div>
      <div class="profile-item">Joined: <span id="join-date">N/A</span></div>
    </div>

    <div class="back-wrapper">
      <a href="index.html" class="back-btn">← Back to Home</a>
    </div>
  </div>

  <script src="core.js"></script>
  <script src="stars.js"></script>
  <script>
    document.addEventListener("DOMContentLoaded", () => {
      ZerinCore.loadData();

      const user = ZerinCore.getUserId();
      const sun = ZerinCore.getSun();
      const league = ZerinCore.getLeague(sun);
      const joinDate = localStorage.getItem("joinDate") || new Date().toISOString().split("T")[0];

      document.getElementById("user-id").textContent = user;
      document.getElementById("user-sun").textContent = sun;
      document.getElementById("user-league").textContent = league;
      document.getElementById("join-date").textContent = joinDate;

      localStorage.setItem("joinDate", joinDate);
    });
  </script>
</body>
</html>
