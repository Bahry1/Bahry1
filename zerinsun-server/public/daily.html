<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ZerinSun – Daily</title>
  <link rel="stylesheet" href="style.css" />
  <link rel="icon" href="favicon.ico" type="image/x-icon" />
  <style>
    body {
      background-color: #000;
      color: #fff;
      font-family: sans-serif;
      margin: 0;
      padding: 0;
      text-align: center;
    }

    .section {
      padding: 20px;
    }

    .stats-box {
      background: #1c1c1c;
      margin: 10px auto;
      padding: 15px;
      border-radius: 12px;
      max-width: 320px;
    }

    #energy-bar-fill {
      width: 0%;
      height: 10px;
      background-color: #0cf;
      transition: width 0.3s ease;
    }

    .energy-bar-container {
      background: #444;
      width: 80%;
      height: 10px;
      margin: 10px auto 30px;
      border-radius: 5px;
      overflow: hidden;
    }

    .back-button {
      padding: 12px 24px;
      border-radius: 12px;
      background: #0cf;
      border: none;
      color: #000;
      font-weight: bold;
      cursor: pointer;
      margin-bottom: 10px;
    }

    .spacer {
      height: 80px;
    }
  </style>
</head>
<body>

  <!-- 📅 تاریخ میلادی -->
  <div class="section">
    <h2 id="current-date">Loading Date...</h2>
  </div>

  <!-- ⏰ تایمر ریست روزانه -->
  <div class="section stats-box">
    <h3>🔁 Next Reset In</h3>
    <div id="reset-timer" style="font-size: 24px;">--:--:--</div>
  </div>

  <!-- 🌍 آمار کلی اپ -->
  <div class="section stats-box">
    <h3>📊 Global Stats</h3>
    <p>👥 Total Users: <span id="totalUsers">...</span></p>
    <p>☀️ Total SUN: <span id="totalSun">...</span></p>
    <p>🌀 Total Taps: <span id="totalTaps">...</span></p>
  </div>

  <!-- ⬜ فضای خالی وسط -->
  <div class="spacer"></div>

  <!-- 🔋 نوار انرژی -->
  <div class="energy-bar-container">
    <div id="energy-bar-fill"></div>
  </div>

  <!-- 🔙 دکمه بازگشت -->
  <button class="back-button" onclick="location.href='index.html'">
    ⬅️ Back to Main
  </button>

  <!-- 📜 اسکریپت‌ها -->
  <script src="core.js"></script>
  <script>
    // 🗓 نمایش تاریخ
    const now = new Date();
    document.getElementById("current-date").textContent = now.toDateString();

    // ⏰ تایمر ریست تا 00:00 UTC
    function updateResetTimer() {
      const now = new Date();
      const reset = new Date();
      reset.setUTCHours(24, 0, 0, 0);
      const diff = reset - now;
      const h = String(Math.floor(diff / 3600000)).padStart(2, '0');
      const m = String(Math.floor((diff % 3600000) / 60000)).padStart(2, '0');
      const s = String(Math.floor((diff % 60000) / 1000)).padStart(2, '0');
      document.getElementById("reset-timer").textContent = `${h}:${m}:${s}`;
    }
    setInterval(updateResetTimer, 1000);
    updateResetTimer();

    // 📡 گرفتن آمار از سرور
    fetch("/api/stats")
      .then(res => res.json())
      .then(data => {
        document.getElementById("totalUsers").textContent = data.totalUsers;
        document.getElementById("totalSun").textContent = data.totalSun + " SUN";
        document.getElementById("totalTaps").textContent = data.totalTaps;
      })
      .catch(err => {
        console.warn("❌ مشکل در دریافت آمار:", err);
      });

    // 🔋 نمایش انرژی کاربر
    window.addEventListener("DOMContentLoaded", () => {
      if (window.ZerinCore) {
        ZerinCore.loadData();
        const fill = document.getElementById("energy-bar-fill");
        const energy = ZerinCore.getEnergy();
        const max = ZerinCore.MAX_ENERGY;
        const percent = (energy / max) * 100;
        fill.style.width = percent + "%";
      }
    });
  </script>

</body>
</html>
