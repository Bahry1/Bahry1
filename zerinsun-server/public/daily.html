<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ZerinSun – Daily Stats</title>
  <link rel="stylesheet" href="style.css" />
  <link rel="icon" href="favicon.ico" type="image/x-icon" />
  <style>
    body {
      background: black;
      color: white;
      font-family: sans-serif;
      text-align: center;
      padding: 30px 10px;
    }
    .box {
      background: #1e1e1e;
      border-radius: 12px;
      padding: 20px;
      margin-bottom: 25px;
    }
    .energy-btn {
      background: none;
      border: 2px solid #0cf;
      color: #0cf;
      padding: 12px 24px;
      font-weight: bold;
      border-radius: 12px;
      cursor: pointer;
      position: relative;
      overflow: hidden;
    }
    .energy-fill {
      position: absolute;
      top: 0;
      left: 0;
      height: 100%;
      background: #0cf;
      width: 0%;
      opacity: 0.2;
      transition: width 0.4s ease;
    }
  </style>
</head>
<body>

  <!-- 🗓️ تاریخ امروز -->
  <h2 id="current-date">Loading date...</h2>

  <!-- ⏰ تایمر ریست روزانه -->
  <div class="box">
    <h3>🔁 Next Reset In</h3>
    <p id="reset-timer" style="font-size: 24px;">--:--:--</p>
  </div>

  <!-- 🌍 آمار کلی -->
  <div class="box">
    <h3>📊 Global Stats</h3>
    <p>👥 Total Users: <span id="totalUsers">...</span></p>
    <p>☀️ Total SUN Mined: <span id="totalSun">...</span></p>
    <p>🌀 Total Taps: <span id="totalTaps">...</span></p>
  </div>

  <!-- 🔙 دکمه بازگشت با نوار انرژی -->
  <button class="energy-btn" onclick="location.href='index.html'">
    <div class="energy-fill" id="energyFill"></div>
    ⬅️ Back to Main Page
  </button>

  <script src="core.js"></script>
  <script>
    // تاریخ میلادی
    const now = new Date();
    document.getElementById("current-date").textContent = now.toDateString();

    // تایمر ریست تا 00:00 UTC
    function updateResetTimer() {
      const now = new Date();
      const reset = new Date();
      reset.setUTCHours(24, 0, 0, 0);
      const diff = reset - now;
      const h = String(Math.floor(diff / 3600000)).padStart(2, '0');
      const m = String(Math.floor((diff % 3600000) / 60000)).padStart(2, '0');
      const s = String(Math.floor((diff % 60000) / 1000)).padStart(2, '0');
      document.getElementById("reset-timer").textContent = `${h}:${m}:${s}`;
    }
    setInterval(updateResetTimer, 1000);
    updateResetTimer();

    // آمار از سرور
    fetch("/api/stats")
      .then(res => res.json())
      .then(data => {
        document.getElementById("totalUsers").textContent = data.totalUsers;
        document.getElementById("totalSun").textContent = data.totalSun + " SUN";
        document.getElementById("totalTaps").textContent = data.totalTaps;
      })
      .catch(err => {
        console.warn("❌ Error loading stats:", err);
      });

    // نوار انرژی روی دکمه
    window.addEventListener("DOMContentLoaded", () => {
      if (window.ZerinCore) {
        ZerinCore.loadData();
        const fill = document.getElementById("energyFill");
        const energy = ZerinCore.getEnergy();
        const max = ZerinCore.MAX_ENERGY;
        const percent = (energy / max) * 100;
        fill.style.width = percent + "%";
      }
    });
  </script>

</body>
</html>
